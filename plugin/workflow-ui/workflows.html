<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox</title>
<link rel="stylesheet" href="steps.css">
<style>
:root{--bg:#F6F5F2;--card:#FFFFFF;--line:#E4E2DC;--soft:#F1EFEA;--side:#F5F4F0;--pill:#EAE8E3;--ink:#1C1C1A;--ink2:#3A3935;--mut:#65635D;--faint:#B9B6AD;
  --blue:#1D4ED8;--bluebg:#F5F8FF;--blueline:#C9D6F8;--green:#1F6B3A;--amber:#8A4B00;--amberdot:#C98A1F;--red:#9B2C22;--grey:#8F8C84}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border:1px solid var(--btnbd);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.sb{min-height:30px;padding:0 10px;font-size:12px}
.pri{background:var(--pri);border-color:var(--pri);color:#FFFFFF;font-weight:600}
.pri:hover{border-color:var(--pri);filter:brightness(1.08)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.35}}
.wrap{display:flex;flex-wrap:nowrap;align-items:stretch;min-height:calc(100vh - 61px)}
.side{flex:0 0 220px;max-width:240px;border-right:1px solid var(--line);background:var(--side);padding:14px 10px}
.side .lbl{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--mut);margin:0 2px 8px 8px}
.side.fold{flex-basis:52px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:5px}
.sfold{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--mut);cursor:pointer}
.sfold:hover{background:var(--pill);color:var(--ink)}
.vmini{min-width:34px;height:28px;padding:0 6px;border:0;border-radius:8px;background:transparent;color:var(--mut);font:600 11px/1 Inter,system-ui,sans-serif;cursor:pointer}
.vmini:hover{background:var(--pill);color:var(--ink)}.vmini.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.v{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:0 8px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);text-decoration:none;font-size:13px;text-align:left;cursor:pointer}
.v:hover{background:rgba(0,0,0,.04)}
.v.on{background:var(--card);border-color:transparent;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.v .n{margin-left:auto;padding:1px 7px;border-radius:999px;background:var(--pill);font-size:11px;color:var(--mut);font-weight:600}
.qnew{display:block;margin:10px 0 0;padding:6px 8px;border:0;background:transparent;font-size:13px;color:var(--blue);cursor:pointer;text-align:left}
.qnew span{color:var(--mut)}
.main{flex:999 1 600px;min-width:0;padding:18px 24px 120px;display:flex;flex-direction:column;gap:10px;max-width:1200px}
.vh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.gh.up{background:transparent;border-bottom:1px dashed var(--line)}.gh.up b{font-weight:500;color:var(--mut)}.up-l{color:var(--mut);text-decoration:none}.up-l:hover{color:var(--fg)}.nxs{margin-left:auto;font-size:13px;color:var(--mut,#5c5c56);text-decoration:none}.nxs:hover{color:var(--fg)}.nxm{color:var(--blue)}
.vh h2{font-size:17px;margin:0;font-weight:600}
.srch{width:220px;max-width:100%;min-height:34px;border:1px solid var(--btnbd);border-radius:8px;padding:0 10px;font:inherit;font-size:13px;background:var(--card)}
.quiet{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mut)}
.quiet .sep{color:var(--faint)}
.cat{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);white-space:nowrap}
.cat .ell{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cat{max-width:100%;overflow:hidden}
.cdot{width:8px;height:8px;border-radius:2px;flex:none;background:var(--grey)}
.tone-blue{background:#3B6FD8}.tone-amber{background:#D38A1C}.tone-teal{background:#1E9C8A}.tone-purple{background:#6B4FBF}
.vsum{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;padding:2px 0 4px}
.vs{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.vl{color:var(--mut)}
.vv{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:6px;background:var(--chip);color:var(--ink);font-weight:500}
.vsum .qlink{margin-left:auto}
.qlink{border:0;padding:0;background:transparent;font-size:12px;color:var(--blue);cursor:pointer;text-decoration:underline;text-decoration-color:var(--blueline);text-underline-offset:3px}
.mut{color:var(--mut)}.sm{font-size:12px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.scroll{overflow-x:auto}
.row{display:grid;gap:12px;align-items:center;padding:0 14px 0 8px;min-height:48px;border-top:1px solid var(--soft);min-width:640px}
.row.hd{min-height:34px;background:var(--side);border-top:0;font-size:12px;font-weight:600;color:var(--mut)}
.row input,.gh input{width:16px;height:16px;margin:0}
.nmw{display:flex;align-items:center;min-width:0}
.nmw .new{flex:none}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm b{font-weight:600}
.tg{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:6px;background:transparent;cursor:pointer}
.tg:hover{background:var(--soft)}
.cv{width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg)}
.cv.o{transform:rotate(45deg);margin-top:-3px}
.row.open,.xp{background:var(--open)}
.gh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:var(--gh);font-size:13px}
.gh:first-of-type{border-top:0}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.d{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.d-notrun{border:2px solid var(--grey)}.d-scheduled{border:2px dashed var(--blue)}.d-paused{border:2px dashed var(--grey)}.d-queued{border:2px solid var(--blue)}.d-running{background:var(--blue)}.d-needs{background:var(--amberdot)}.d-check{background:#B07AD9}.d-failed{background:var(--red)}
.d-stopped{background:var(--red)}.d-done{background:var(--green)}
.tres{font-weight:600}.st.tres{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.miss{border:1px solid var(--bd2);border-left:4px solid var(--amberdot);border-radius:8px;padding:10px 14px;margin:10px 0}
.miss ul{margin:6px 0 0;padding-left:18px}.miss li{font-size:13px;margin:2px 0}.tres.pass{color:var(--green)}.tres.fail{color:var(--amberdot)}.d-skipped,.d-nothing{background:#C9C6BE}
.st-needs{color:var(--amber);font-weight:600}
.when{font-size:12px;color:var(--mut);white-space:nowrap}
.when2{display:flex;flex-direction:column;font-size:12px;color:var(--ink2);white-space:nowrap;line-height:1.3}
.when2 .w2{font-size:11px;color:var(--mut)}
.new{display:inline-block;margin-left:8px;padding:0 6px;border-radius:6px;background:var(--newbg);color:var(--blue);font-size:11px;font-weight:600;vertical-align:1px}
.tag2{font-size:12px;color:var(--mut);font-weight:400}
.swarn{display:inline-flex;align-items:center;margin-left:6px;padding:0;border:0;background:none;cursor:pointer;color:#b26a00;text-decoration:none;flex:none}.swarn:hover{color:#8a4f00}.swarn svg{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .swarn{color:#f0b35a}}:root[data-theme=dark] .swarn{color:#f0b35a}
.swarn.sinfo{color:#2B7BB9}.swarn.sinfo:hover{color:#1d5f92}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .swarn.sinfo{color:#7cc0ef}}:root[data-theme=dark] .swarn.sinfo{color:#7cc0ef}
.act{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.more3{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--mut);font-size:16px;line-height:1;cursor:pointer}
.more3:hover,.more3[aria-expanded="true"]{background:var(--chip);color:var(--ink)}
.menu3{position:absolute;right:0;top:34px;z-index:6;width:220px;padding:6px;background:var(--card);border:1px solid var(--btnbd);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);text-align:left;cursor:default}
.menu3 .mh{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:6px 8px 4px}
.mi3{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border:0;border-radius:6px;background:transparent;color:var(--ink);font-size:13px;text-align:left;cursor:pointer}
.mi3:hover{background:var(--chip)}.mi3.on{font-weight:600}
.mi3 .ck{width:12px;font-size:12px;color:var(--blue)}
.mi3.pri3{color:var(--blue);font-weight:600}
a.mi3{text-decoration:none}
.btn.sb.sdel{color:var(--red)}
.mi3.del{color:var(--red)}
.msep{height:1px;background:var(--line);margin:5px 4px}
.xp{padding:6px 18px 18px 64px;border-top:0}
.xp.not{border-left:3px solid var(--grey)}.xp.ran{border-left:3px solid var(--green)}.xp.need{border-left:3px solid var(--amberdot)}.xp.run{border-left:3px solid var(--blue)}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;margin-bottom:10px;background:var(--soft);color:var(--ink2)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.k{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:2px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--mut)}
.kv span{overflow-wrap:anywhere}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.fs{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12px}
.step{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start;padding:3px 0;font-size:13px}
.tag{display:inline-flex;justify-content:center;font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--soft)}
.tag.do{background:var(--badb);color:var(--red)}

.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.more{padding:9px 16px;border-top:1px solid var(--soft)}
.lnk{color:var(--blue);background:transparent;border:0;padding:0;cursor:pointer;font-size:12px;text-decoration:none}
.empty{padding:28px 16px;text-align:center;color:var(--mut)}
.selbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:12px;flex-wrap:nowrap;white-space:nowrap;max-width:calc(100vw - 32px);padding:10px 14px;background:var(--card);border:1px solid var(--btnbd);border-radius:12px;box-shadow:0 10px 30px rgba(28,28,26,.14)}
.tk{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#1F6B3A;font-size:11px;flex:none;margin-top:1px}
.panel{position:fixed;top:74px;right:16px;bottom:16px;z-index:7;width:400px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 48px rgba(28,28,26,.18);display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--soft)}
.ph h2{font-size:16px;margin:0;font-weight:600}
.pb{flex:1;overflow:auto;padding:6px 18px 14px}
.pf{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--soft);margin-top:auto;flex:none;background:var(--card)}
.panel .rp-sl,.panel .rp-pl{flex:1 1 auto;min-height:0}.panel .rp-pad,.panel .rp-ctx,.panel .rp-ctxl,.panel .ptabs,.panel .ph{flex:none}
.ptabs{display:flex;gap:4px;padding:8px 18px 0;border-bottom:1px solid var(--soft)}
.ptab{border:0;background:transparent;padding:8px 10px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:13px;color:var(--mut);cursor:pointer}
.rp-ctx{display:flex;flex-direction:column;gap:4px;padding:10px 18px 0}
.rp-ctxl{padding:8px 18px 2px}.rp-ctxl .lnk{font-size:13px;font-weight:600;text-decoration:none}
.rp-segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;margin-bottom:10px;border-radius:10px;background:var(--soft)}
.rp-seg{height:32px;border:0;border-radius:7px;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--mut);cursor:pointer}
.rp-seg.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,20,20,.12)}
.rp-seg:disabled{opacity:.45;cursor:default}
.rp-gearb{display:inline-flex;align-items:center;justify-content:center}.rp-gearb.on{background:var(--soft);color:var(--ink)}
.rp-gear{position:absolute;top:56px;right:50px;z-index:3;width:280px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(28,28,26,.16)}
.rp-gh{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:2px 4px 6px}
.rp-gsw{display:flex;align-items:center;gap:10px;width:100%;padding:8px 4px;border:0;border-radius:8px;background:none;font:inherit;text-align:left;color:var(--ink);cursor:pointer}.rp-gsw:hover{background:var(--hover)}
.rp-gsw .tx{flex:1;display:flex;flex-direction:column;gap:2px}.rp-gsw b{font-size:13px;font-weight:600}.rp-gsw .tx span{font-size:12px;color:var(--mut)}
.rp-gsw .rp-sw{pointer-events:none}
.rp-ctx label{font-size:12px;font-weight:600;color:var(--ink)}
.rp-ctx textarea{font:inherit;font-size:13px;resize:vertical;min-height:40px;padding:6px 8px;border:1px solid var(--btnbd);border-radius:8px;background:var(--card);color:var(--ink)}
.rp-sws{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px 0}
.rp-sw{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:2px 0;font-size:12px;color:var(--ink);cursor:pointer}
.rp-sw .tr{position:relative;width:26px;height:15px;border-radius:8px;background:var(--btnbd);transition:background .15s}
.rp-sw .tr span{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .15s}
.rp-sw.on .tr{background:var(--ok,#1a7f37)}.rp-sw.on .tr span{left:13px}
.ptab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.past{padding:12px 0;border-bottom:1px solid var(--soft)}
.past .p1{display:flex;align-items:center;gap:8px;font-size:13px}
.past .p2{font-size:13px;color:var(--ink2);margin-top:4px}
.past .p3{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-top:4px}
.past .p4{display:flex;gap:14px;margin-top:8px}
.area{font-size:12px;color:var(--mut);margin:12px 0 2px}
.tr{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
.tr input{width:16px;height:16px;flex:none;margin:0}
.tr .nm2{flex:1;min-width:0}

/* the Run panel: a type-to-run box with tags (New run), and a filtered list of runs (Past runs) */
.rp-pad{padding:14px 18px 6px;position:relative}
.rp-box{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:42px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:text}
.rp-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.rp-in{flex:1;min-width:120px;border:0;outline:0;background:transparent;font:inherit;font-size:13.5px;color:var(--ink);padding:3px 2px}
.rp-tok{display:inline-flex;align-items:center;gap:5px;padding:3px 4px 3px 7px;border-radius:6px;background:var(--soft);font-size:12.5px;font-weight:500;cursor:default}
.rp-tok[data-rpop]{cursor:pointer}.rp-tok em{font-style:normal;color:var(--mut);font-weight:600;margin-left:1px}
.rp-tok button{border:0;background:none;color:var(--faint);font:inherit;font-size:14px;line-height:1;padding:0 3px;cursor:pointer}.rp-tok button:hover{color:var(--ink)}
.rp-tok.sel{background:var(--bluebg);box-shadow:inset 0 0 0 1.5px var(--blue)}
.rp-hint{font-size:12px;color:var(--faint);padding:6px 2px 0}.rp-hint .lnk{font-size:12px;margin-left:4px}
.rp-sl{padding:2px 10px 10px;overflow:auto}.rp-sh{font-size:11.5px;font-weight:600;color:var(--faint);padding:10px 8px 3px}
.rp-sr{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;border-radius:8px;background:none;font:inherit;font-size:13.5px;color:var(--ink);text-align:left;cursor:pointer}
.rp-sr:hover{background:var(--hover)}.rp-sr.hi{background:var(--bluebg)}.rp-sr.dim{opacity:.45;cursor:default}
.rp-sr .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rp-sr .st b{font-weight:600}.rp-sr .st span{color:var(--faint)}
.rp-sr kbd{font:11px ui-monospace,Menlo,monospace;color:var(--faint)}
.rp-pop{margin-top:8px;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(28,25,23,.10);padding:6px;background:var(--card)}
.rp-poph{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13px}.rp-poph b{flex:1}.rp-poph span{font-size:12px;color:var(--mut)}
.rp-popr{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;margin-top:2px;border:0;border-radius:7px;background:var(--bluebg);font:inherit;font-size:13.5px;color:var(--ink);text-align:left;cursor:pointer}
.rp-popr.off{background:none;color:var(--faint)}.rp-popr .ck{width:14px;color:var(--blue);font-weight:700}.rp-popr span:nth-child(2){flex:1}.rp-popr .r{font-size:12px;color:var(--faint)}
.rp-pophint{font-size:11.5px;color:var(--faint);padding:6px 8px 2px}
.rp-empty{display:flex;flex-direction:column;gap:4px;padding:16px 20px}.rp-empty span,.rp-empty small{font-size:12.5px;color:var(--mut)}.rp-empty small{font-size:11.5px;color:var(--faint)}.rp-empty .lnk{align-self:flex-start;margin-top:8px;font-weight:600}
.rp-pl{padding:2px 14px 10px;overflow:auto}.rp-dh{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--faint);padding:12px 4px 4px}.rp-dh span+span{font-weight:500}
.rp-pr{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto 34px;gap:8px;align-items:center;padding:6px 4px;border-top:1px solid var(--soft);border-radius:6px;cursor:pointer;position:relative}
.rp-pr:hover{background:var(--hover)}.rp-pr.live{background:var(--bluebg)}
.rp-pr .sl1{font-size:13.5px}.rp-pr .sl2{padding-left:0}.rp-pr .spill{margin-top:-1px}
.rp-acts{display:none;gap:6px}.rp-pr:hover .rp-acts{display:flex}.rp-pr:hover .rp-st{display:none}.rp-acts .btn{padding:2px 8px;font-size:12px}
.rp-pr.sub{cursor:default;background:var(--open,#fcfcfa);border-top:0;padding:6px 4px}.rp-pr.sub:hover{background:var(--open,#fcfcfa)}.rp-pr.sub .stree{left:10px}.rp-pr.sub .stree::after{display:none}
.rp-emp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 20px;text-align:center}.rp-emp span{font-size:12.5px;color:var(--mut);max-width:280px}.rp-emp .lnk{margin-top:8px;font-weight:600}

.rp-n{font-size:12px;color:var(--mut);white-space:nowrap}.rp-pr .sl1{height:22px}.rp-pr.sub .rp-n{font-size:11.5px}
.rp-cat{display:flex;align-items:center;gap:4px;padding:1px 0}.rp-cat .schev{height:30px}
.rp-catb{flex:1;display:flex;align-items:center;gap:8px;padding:6px 8px;border:0;border-radius:8px;background:none;font:inherit;font-size:13.5px;color:var(--ink);text-align:left;cursor:pointer}.rp-catb:hover,.rp-wf:hover{background:var(--hover)}
