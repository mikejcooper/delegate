<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Builder</title>
<link rel="stylesheet" href="steps.css">
<style>
:root{--bg:#f6f6f3;--card:#fff;--soft:#fafaf8;--fg:#1a1a18;--mut:#5c5c56;--bd:#e3e3de;--bd2:#d2d2cb;--acc:#2b55c6;--selb:#eef2fc;
--need:#8a4100;--needb:#fcebd7;--ok:#1e6b3e;--okb:#dff1e6;--okt:#173f28;--skip:#4d4d48;--skipb:#ecece8;--cta:#1a1a18;--ctafg:#fff;
--k-d:#3d3d39;--k-db:#ecece8;--k-i:#0b5c5c;--k-ib:#dcefed;--k-s:#1d3e99;--k-sb:#e2e9fb;--k-a:#4b3a99;--k-ab:#ece6fb;--bar-s:#2b55c6;--bar-i:#0f6e6e;--k-n:#8a4b00;--k-nb:#fbeedd;--bar-n:#c27012;--k-w:#1f6b2e;--k-wb:#e1f2e3;--bar-w:#2f8f45;--bar-a:#6b4fbf;--k-r:#8a1f5c;--k-rb:#f8e1ee;--bar-r:#b8327f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1c1a;--card:#262624;--soft:#2c2c29;--fg:#f1efe8;--mut:#b4b2a9;--bd:#3d3d3a;--bd2:#55554f;--acc:#9db8f5;--selb:#22304f;
--need:#fac775;--needb:#5a3405;--ok:#a8d8b6;--okb:#1f4a2f;--okt:#cfead8;--skip:#c9c7bf;--skipb:#3a3a37;--cta:#f1efe8;--ctafg:#1a1a18;
--k-d:#e4e2da;--k-db:#3a3a37;--k-i:#8fd6d0;--k-ib:#173f3d;--k-s:#b5cdf6;--k-sb:#22355f;--k-a:#cbbdf5;--k-ab:#33285a;--bar-s:#7d9ef0;--bar-i:#4fb3ac;--k-n:#f3c38a;--k-nb:#4a3216;--bar-n:#e0a050;--k-w:#a6dcb0;--k-wb:#1e3d24;--bar-w:#64bf78;--bar-a:#a48ee8;--k-r:#f0a6cf;--k-rb:#3d2233;--bar-r:#d0609f}}
:root[data-theme=dark]{--bg:#1c1c1a;--card:#262624;--soft:#2c2c29;--fg:#f1efe8;--mut:#b4b2a9;--bd:#3d3d3a;--bd2:#55554f;--acc:#9db8f5;--selb:#22304f;
--need:#fac775;--needb:#5a3405;--ok:#a8d8b6;--okb:#1f4a2f;--okt:#cfead8;--skip:#c9c7bf;--skipb:#3a3a37;--cta:#f1efe8;--ctafg:#1a1a18;
--k-d:#e4e2da;--k-db:#3a3a37;--k-i:#8fd6d0;--k-ib:#173f3d;--k-s:#b5cdf6;--k-sb:#22355f;--k-a:#cbbdf5;--k-ab:#33285a;--bar-s:#7d9ef0;--bar-i:#4fb3ac;--k-n:#f3c38a;--k-nb:#4a3216;--bar-n:#e0a050;--k-w:#a6dcb0;--k-wb:#1e3d24;--bar-w:#64bf78;--bar-a:#a48ee8;--k-r:#f0a6cf;--k-rb:#3d2233;--bar-r:#d0609f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit}
a{color:var(--acc)}
.wrap{display:flex;flex-wrap:wrap;gap:28px;padding:24px;max-width:1440px;margin:0 auto;align-items:flex-start}
nav{flex:1 1 240px;max-width:280px;display:flex;flex-direction:column}
.cg{display:flex;align-items:center;gap:8px}
.grp{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 12px 4px}
.grp:first-child{margin-top:0}
.grp .gn{flex:1;min-width:0}
.gb{width:calc(100% - 24px);padding:0;border:0;background:none;cursor:pointer;text-align:left;font-family:inherit}
.gb .chev{color:var(--mut);transition:transform .12s}.gb[aria-expanded=true] .chev{transform:rotate(90deg)}
.gb .gc{font-weight:500;letter-spacing:0}
.sec{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 12px 4px;padding-top:12px;border-top:1px solid var(--bd)}
.sk{font-size:12px;font-weight:500;color:var(--mut);margin:8px 12px 2px 12px}
.nb{display:flex;align-items:center;gap:8px;width:100%;padding:6px 12px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;font-size:13px;font-weight:500;color:var(--fg)}
.nb:hover{background:var(--card);border-color:var(--bd)}
.nb.sel{background:var(--card);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.nb .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb .n{font-size:12px;font-weight:500;color:var(--mut);font-variant-numeric:tabular-nums;min-width:14px;text-align:right}
.nb.none .nm{color:var(--mut)}
.nb.sub{padding-left:22px}.nb.kid{padding-left:34px;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.dot-seen{background:#1e8a4c}.dot-inf{border:1.5px dashed var(--mut)}.dot-att{width:7px;height:7px;background:#d4a017}
.cdot{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.cat-blue{background:var(--bar-s)}.cat-teal{background:var(--bar-i)}.cat-amber{background:var(--bar-n)}.cat-purple{background:var(--bar-a)}.cat-none{background:var(--need)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.nsearch{display:flex;flex-direction:column;gap:8px;padding:0 4px 12px}
.nsearch input[type=search]{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--bd2);background:var(--card);color:var(--fg);font:inherit;font-size:14px}
.nsearch input[type=search]:focus{outline:2px solid var(--acc);outline-offset:-1px}
.chk{display:flex;align-items:center;gap:8px;padding:0 8px;font-size:13px;color:var(--mut);cursor:pointer}
.draftb{border:1px dashed var(--acc);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13px;line-height:1.5}.draftb p{margin:4px 0}.draftb ul{margin:2px 0 6px 18px;padding:0}.draftb code{font-size:12px}
.sublnk{display:block;margin-top:4px;font-size:13px}
.fb{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;font-size:14px;font-weight:600;color:var(--fg)}
.fb:hover{background:var(--card);border-color:var(--bd)}
.fb .chev{flex:none;color:var(--mut);transition:transform .12s}
.fb[aria-expanded=true] .chev{transform:rotate(90deg)}
.fb .nm{flex:1;min-width:0}
.fb .n{font-size:12px;font-weight:500;color:var(--mut)}
.fk{display:flex;flex-direction:column;margin-left:14px;padding-left:8px;border-left:1px solid var(--bd)}
.et{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 4px;border-radius:5px;background:var(--soft);border:1px solid var(--bd);font-size:11px;font-weight:600;color:var(--mut)}
.nempty{padding:8px 12px;font-size:13px;color:var(--mut)}
main{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:16px}
.hd h2{margin:0;font-size:26px;line-height:32px;font-weight:700}
.hd p{margin:6px 0 0;font-size:16px;line-height:24px;max-width:760px}
.lnk{font:inherit;font-size:13px;font-weight:600;color:var(--acc);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pl{height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--bd);background:var(--card);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pl.inf{border-style:dashed}
.pl.sel{border-color:var(--cta);border-style:solid;background:var(--cta);color:var(--ctafg)}
.pl.sel .dot-inf{border-color:var(--ctafg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plab{font-size:13px;color:var(--mut);margin-right:4px}
.runs{display:flex;flex-direction:column;gap:10px}
.runs h3{margin:0;display:flex;align-items:baseline;gap:8px;font-size:17px;font-weight:700}
.runs h3 .n{font-size:13px;font-weight:500;color:var(--mut)}
.rl{display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:14px;background:var(--card);overflow:hidden}
.rl.wv .rr{grid-template-columns:118px 48px minmax(0,1fr) 92px 140px}
.rl.wv .rh{display:grid;grid-template-columns:118px 48px minmax(0,1fr) 92px 140px;gap:14px;padding:6px 16px;border-bottom:1px solid var(--bd);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);background:var(--soft)}
.rr .t small .took{display:block}
.vcol{display:flex;align-items:center}.vcol .vchip{margin-left:0}.vcol.none{color:var(--mut)}
.rr{display:grid;grid-template-columns:118px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:7px 16px;border-top:1px solid var(--bd);font-size:13px;line-height:20px}
.rr:first-child{border-top:0}
.rr:hover{background:var(--soft)}
.rr.sel{background:var(--selb);box-shadow:inset 3px 0 0 var(--acc)}
.rr .t{font-weight:600}.rr .t small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.rr .pth{font-size:13px}.rr .pth.none{color:var(--mut);font-style:italic}
.rr .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr a{font-size:13px;font-weight:600;white-space:nowrap}
.rmore{align-self:flex-start}
@media (max-width:720px){.rr,.rl.wv .rr{grid-template-columns:1fr auto auto}.rl.wv .rh{display:none}.rr .pth,.rr .v{grid-column:1/-1}}
.ch{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--bd);font-size:14px;color:var(--mut)}
.skc-n{background:var(--k-nb);color:var(--k-n)}.skc-w{background:var(--k-wb);color:var(--k-w)}
.mlink{align-self:flex-start;margin-top:2px;padding:0;border:0;background:none;font-size:12px;color:var(--mut);cursor:pointer}
.mlink:hover{color:var(--fg)}
.side{padding-top:14px}
.wb{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--bd2);background:var(--card);font-size:13px;font-weight:600;cursor:pointer}
.wb[aria-expanded=true]{background:var(--cta);border-color:var(--cta);color:var(--ctafg)}
.whyb{display:flex;flex-direction:column;gap:6px;margin-top:4px;padding:12px 14px;border-radius:10px;background:var(--soft);border:1px solid var(--bd)}
.src{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;font-weight:600}
.skc{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600}
.skc-d{background:var(--k-db);color:var(--k-d)}.skc-i{background:var(--k-ib);color:var(--k-i)}.skc-s{background:var(--k-sb);color:var(--k-s)}.skc-a{background:var(--k-ab);color:var(--k-a)}
.sum{margin:0;font-size:14px;line-height:20px}
.whyb .lnk{align-self:flex-start}
.rule{margin:0;padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--bd);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.warn{font-size:13px;color:var(--need)}
.more{display:flex;flex-direction:column;gap:8px;margin-top:2px;padding-top:8px;border-top:1px dashed var(--bd)}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
.c{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--skipb);color:var(--fg)}
.alts{display:flex;flex-direction:column;gap:4px}
.alt{display:flex;align-items:center;gap:10px;font-size:13px;padding:3px 8px;border-radius:6px}
.alt .w{color:var(--mut);min-width:130px}
.alt.taken{background:var(--selb);font-weight:600}
.alt.muted{opacity:.5}
.alt .tk{white-space:nowrap;margin-left:auto;font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.e{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.e-done{background:var(--okb);color:var(--ok)}.e-info,.e-stop{background:var(--skipb);color:var(--skip)}.e-ask{background:var(--needb);color:var(--need)}.e-check{color:var(--need);box-shadow:inset 0 0 0 1.5px var(--need)}.e-next{box-shadow:inset 0 0 0 1px var(--bd2)}
.lks{display:flex;flex-wrap:wrap;gap:6px}
.lk{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--acc);background:var(--card);color:var(--acc);font-size:12px;font-weight:600;cursor:pointer}
.note{font-size:12px;color:var(--mut)}
.empty{padding:20px;color:var(--mut)}
/* Overview (home): the default view, a simple picture of how the board works */
.nb.ov{gap:10px;justify-content:flex-start;margin-bottom:6px}
.ovw{display:flex;flex-direction:column;max-width:820px}
.ovflow{margin:4px 0 20px;padding:16px 18px 10px;background:var(--card);border:1px solid var(--bd);border-radius:16px}
.ovflow svg{display:block;width:100%;height:auto}
.ovflow .bx{fill:var(--soft);stroke:var(--bd2);stroke-width:1}.ovflow .bx.run{fill:var(--acc);stroke:none}
.ovflow .ln{fill:none;stroke:var(--bd2);stroke-width:1.5}
.ovflow .t{fill:var(--fg);font:600 13px Inter,system-ui,sans-serif}.ovflow .t.w{fill:#fff}.ovflow .s{fill:var(--mut);font:12px Inter,system-ui,sans-serif}
.ovflow .h{fill:var(--mut);font:700 11px Inter,system-ui,sans-serif;letter-spacing:.06em}
.ovflow .dot{fill:var(--acc)}
@media (prefers-reduced-motion:reduce){.ovflow .dot{display:none}}
.ovw .hd{margin-bottom:18px}
.ovs{display:flex;flex-wrap:wrap;gap:16px 20px;padding:20px;background:var(--card);border:1px solid var(--bd);border-radius:16px}
.ovs.fb2{background:var(--selb);border-color:var(--acc)}
.ovt{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:6px}
.ovt h3{margin:4px 0 0;font-size:17px;line-height:22px;font-weight:700}
.ovt p{margin:0;font-size:14px;line-height:20px;color:var(--mut)}
.ovt a{margin-top:4px;font-size:13px;font-weight:600}
.ovn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--bd2);background:var(--card);color:var(--fg);font-size:12px;font-weight:700}
.ovv{flex:2 1 320px;min-width:0;display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--soft);border:1px solid var(--bd);border-radius:12px}
.ovs.fb2 .ovv{background:var(--card)}
.ovv.list{gap:0;padding:0;overflow:hidden}
.ovsrc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ovsrc>div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;text-align:center}
.ovsrc>div.more{border:1.5px dashed var(--bd2);color:var(--mut)}
.ovsrc b{font-size:13px}.ovsrc span{font-size:12px;line-height:16px;color:var(--mut)}
.ovc{display:flex;align-items:center;gap:12px;height:32px;padding-left:33px;font-size:12px;color:var(--mut)}
.ovc i{width:2px;height:32px;background:var(--bd2)}
.ovc i.dash{background:repeating-linear-gradient(var(--bd2) 0 4px,transparent 4px 8px)}
.ovchips{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ovchips .lb{font-size:12px;color:var(--mut);margin-right:2px}
.ovk{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600}
.ovk.s{background:var(--k-sb);color:var(--k-s)}.ovk.i{background:var(--k-ib);color:var(--k-i)}.ovk.off{border:1.5px dashed var(--bd2);color:var(--mut)}
.ovplan{display:flex;flex-direction:column;padding-top:10px;border-top:1px dashed var(--bd2)}
.ovplan .lb{font-size:12px;color:var(--mut);margin-bottom:4px}
.ovst{display:flex;align-items:center;gap:10px;min-height:32px;font-size:13px}
.ovst b{flex:1;min-width:0}
.ovst .no{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--card);border:1px solid var(--bd2);font-size:11px;font-weight:700}
.ovst .sk{font-size:12px;font-weight:600}.ovst .sk.s{color:var(--k-s)}.ovst .sk.i{color:var(--k-i)}
.ovr{display:flex;align-items:center;gap:8px;padding:9px 14px 9px 30px;border-top:1px solid var(--bd);font-size:13px}
.ovr:first-child{border-top:0;padding-left:14px;background:var(--card)}
.ovr .nm{flex:1;min-width:0}
.ovp{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600}
.ovp.ok{background:var(--okb);color:var(--ok)}.ovp.need{background:var(--needb);color:var(--need)}.ovp.now{box-shadow:inset 0 0 0 1px var(--bd2);color:var(--fg)}.ovp.acc{background:var(--selb);color:var(--acc)}
.ovfb{display:flex;align-items:center;gap:8px;font-size:13px}
.ovfb .nm{flex:1;min-width:0}
.ovbad{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--soft);border:1px solid var(--bd);border-radius:10px}
.ovq{padding:8px 10px;background:var(--card);border:1px solid var(--bd2);border-radius:8px;font-size:13px}
.ovloop{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px dashed var(--bd2);font-size:12px;font-weight:600;color:var(--acc)}
@media (max-width:720px){.colhr{display:none}.wrap{padding:16px}nav{max-width:none}}
.skn{margin-top:2px}
.hbtn{margin-top:6px}
.hist{border:1px solid var(--bd);border-radius:10px;background:var(--card);margin-top:12px;overflow:hidden}
.hist h3{font-size:14px;margin:0;padding:10px 16px;border-bottom:1px solid var(--bd)}
.hv{padding:10px 16px;border-top:1px solid var(--bd)}.hist h3+.hv{border-top:0}
.hv.at{background:var(--selb)}
.hv .vh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.vn{font-weight:700;color:var(--fg)}
.vrbtn{font-size:13px}
.hv.vdraft{background:var(--soft)}.hv.vdraft .vn{color:var(--need)}
.vrev{margin-top:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--soft);font-size:13px}
.vrev.might{border-color:var(--need)}.vrev.will{border-color:var(--fl-fail)}
.rvh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.rvs{margin-top:4px;color:var(--mut)}
.rvok{color:var(--ok);font-weight:600}.rvno{color:var(--fl-fail);font-weight:600}
.rvl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rvl li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.rvr{flex:1;min-width:0}
.rvv{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap;background:var(--okb);color:var(--ok)}
.vwait{margin-left:auto;font-size:12px;font-weight:600;color:var(--need)}
.rv-might{background:var(--needb);color:var(--need)}.rv-will{background:var(--fl-failb);color:var(--fl-fail)}
.vpback{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:40}
.vpanel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--bg);border-left:1px solid var(--bd);box-shadow:-8px 0 24px rgba(0,0,0,.12);z-index:41;display:flex;flex-direction:column}
.vph{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 12px;border-bottom:1px solid var(--bd);background:var(--card)}
.vph>div{flex:1;min-width:0}.vph h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}.vph p{margin:4px 0 0;font-size:13px;line-height:19px;color:var(--mut)}

window.addEventListener("popstate",function(){var q=new URLSearchParams(location.search),w=q.get("w")||"home";
  if(w!==UI.view){UI.why={};UI.open={};UI.itab={};UI.qmore=false;UI.showNotRun=false;UI.details=false;UI.allRuns=false;UI.verRuns=null}
  UI.view=w;UI.tab=q.get("tab")||"overview";UI.ex=null;UI.exRun=null;UI.wantRun=q.get("run")||"";UI.menu=null;UI.hist=false;UI.histAt=null;UI.copied=null;UI.navPush=false;
  render();window.scrollTo(0,0)});
function setNavFold(f){if(NARROW.matches){UI.navDrawer=!f;render();return} /* narrow: open or close the drawer, the wide choice kept */
  UI.navFold=f;try{localStorage.setItem("board.wf.navfold",f?"1":"0")}catch(e){}render()}
/* a narrow window (about a third of a desktop screen, or less): the sidebar starts folded to its rail, and opens as a
   drawer over the page instead of pushing the page down; picking something, or a click outside it, closes it */
try{NARROW.addEventListener("change",function(){UI.navDrawer=false;render()})}catch(e){}
(function(){var sc=document.createElement("div");sc.id="navscrim";sc.hidden=true;sc.addEventListener("click",function(){UI.navDrawer=false;render()});document.body.appendChild(sc)})();
document.addEventListener("keydown",function(ev){var tg=ev.target,typing=tg&&(tg.tagName==="INPUT"||tg.tagName==="TEXTAREA"||tg.isContentEditable);
  if(ev.key==="["&&!typing&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey){ev.preventDefault();setNavFold(!navFolded())}
  if(ev.key==="Escape"&&NARROW.matches&&UI.navDrawer){UI.navDrawer=false;render()}});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&UI.menu){UI.menu=null;render();return}if(ev.key==="Escape"&&UI.verRuns){UI.verRuns=null;render();return}});
document.addEventListener("input",function(ev){if(!ev.target)return;if(ev.target.id==="nwpath")UI.nwPath=ev.target.value;if(ev.target.id==="nwdesc"){UI.nwDesc=ev.target.value;if(UI.copied==="newwf"){UI.copied=null}}});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target&&ev.target.id==="nwpath"){var b=document.querySelector("[data-impcopy]");if(b)b.click()}});
pollDefs();poll();
</script>
